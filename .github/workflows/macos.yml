name: Build macOS

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/macos.yml'
      - 'build_macos.py'
      - 'macos-template/**'
      - 'README-MACOS.md'
      - 'bot.py'
      - 'run_bot.py'
      - 'attachments.py'
      - 'storage.py'
      - 'transfer.py'
      - 'verify_backup.py'
      - 'requirements*.txt'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: Apple-Silicon
          - runner: macos-15-intel
            architecture: Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture == 'Intel' && 'x64' || 'arm64' }}
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python build_macos.py
      - uses: actions/upload-artifact@v7
        with:
          name: Discord-Backup-Bot-macOS-${{ matrix.architecture }}
          path: dist/Discord-Backup-Bot-macOS-${{ matrix.architecture }}.zip
          if-no-files-found: error
